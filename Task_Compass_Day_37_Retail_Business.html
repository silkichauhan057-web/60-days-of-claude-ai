<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task Compass — Day 37</title>
<style>
:root{--bg:#070b16;--panel:#12192bdb;--text:#eef3ff;--muted:#9ca9c5;--line:#ffffff1a;--a:#7c5cff;--c:#27d8ff;--g:#46e6a5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 10%,#7c5cff2e,transparent 30%),radial-gradient(circle at 85% 20%,#27d8ff1f,transparent 28%),var(--bg)}
.app{max-width:1150px;margin:auto;padding:25px 18px 45px}.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:0 20px 60px #0008;backdrop-filter:blur(14px)}
header{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:22px}small,.stageNo,.label{color:var(--c);font-weight:800;letter-spacing:1.5px}h1{font-size:clamp(2.2rem,6vw,4rem);margin:4px 0;letter-spacing:-2px}.subtitle{color:var(--muted);margin:0}.day{padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:#ffffff0a;font-weight:700}
.progressTop{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:8px}.progress{height:8px;background:#151c2d;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--c));transition:.5s}
.intro{padding:26px;margin:20px 0}.intro h2{margin:7px 0;font-size:2rem}.intro p{color:var(--muted);line-height:1.6;max-width:760px}.task{padding:23px}.ticket{padding:20px;border:1px solid #7c5cff55;border-radius:18px;background:linear-gradient(135deg,#7c5cff1e,#27d8ff0b);margin-bottom:20px}.ticket h3{margin:8px 0 0;line-height:1.45}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:11px}.role{padding:16px;border-radius:17px;background:#192239e8;border:1px solid var(--line);cursor:grab;transition:.2s}.role:hover,.role.selected{transform:translateY(-3px);border-color:#27d8ff99;box-shadow:0 0 0 2px #27d8ff16}.role span{display:block;color:var(--muted);font-size:.78rem;margin-top:5px}.icon{font-size:1.6rem}
.drop{min-height:80px;margin:18px 0;border:2px dashed #27d8ff66;border-radius:18px;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center}.drop.over{background:#27d8ff12;border-color:var(--c)}.drop.filled{border-style:solid;color:var(--text)}
.btn{border:0;border-radius:13px;padding:12px 18px;background:linear-gradient(135deg,var(--a),#5b8cff);color:white;font-weight:800;cursor:pointer;margin:5px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{background:#ffffff0b;border:1px solid var(--line)}
.feedback{display:none;margin-top:18px;padding:20px;border-radius:18px;background:#ffffff08;border:1px solid var(--line);animation:pop .3s}.feedback.show{display:block}.feedback p{color:#c8d2e8;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.info{padding:14px;border-radius:14px;background:#ffffff08}.info strong{display:block;color:var(--c);font-size:.75rem;text-transform:uppercase;margin-bottom:5px}
.route{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:17px 0}.slot{min-width:125px;min-height:62px;padding:10px;border:2px dashed #ffffff22;border-radius:15px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted)}.slot.over{border-color:var(--c);background:#27d8ff10}.arrow{color:var(--a);font-size:1.3rem}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.chip{padding:10px 13px;border-radius:12px;background:#7c5cff22;border:1px solid #7c5cff66}
.final{display:none;padding:28px;margin-top:20px}.final.show{display:block;animation:pop .5s}.celebrate{font-size:3rem}.bar{margin:14px 0}.barhead{display:flex;justify-content:space-between}.track{height:11px;background:#151c2d;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--c));transition:1s}.insight{padding:17px;border-radius:16px;background:#ffffff08;margin:10px 0;line-height:1.6}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}@media(max-width:650px){header{flex-direction:column}.task{padding:16px}.intro h2{font-size:1.6rem}}
</style>
</head>
<body>
<div class="app">
<header><div><small>DAY 37 • ORGANIZATIONAL SIMULATION</small><h1>Task Compass</h1><p class="subtitle">Learn how work flows through real organizations.</p></div><div class="day">🛍️ Retail Business</div></header>
<div><div class="progressTop"><span id="st">Stage 1 of 3</span><span id="qt">Question 1 of 3</span></div><div class="progress"><i id="pg"></i></div></div>
<main id="game"></main>
<section id="final" class="final card"></section>
</div>
<script>
"use strict";
const R={manager:["Store Manager","🧭","Leadership"],sales:["Sales Associate","🛒","Sales"],inventory:["Inventory Specialist","📦","Inventory"],customer:["Customer Support","💬","Customer"],visual:["Visual Merchandiser","🎨","Merchandising"],marketing:["Marketing Lead","📣","Marketing"],ecommerce:["E-commerce Specialist","🖥️","Digital"],finance:["Finance Associate","💰","Finance"]};
const S1=[
["Online order shows delivered but customer never received it.","customer",["ecommerce","inventory"],"Support owns the customer-facing investigation and coordinates the internal check."],
["Stock count for a popular product repeatedly differs from the system.","inventory",["manager","ecommerce"],"Inventory owns stock accuracy and reconciliation."],
["A weekend promotion needs to launch across the online store.","marketing",["ecommerce","visual"],"Marketing coordinates campaign messaging while digital teams implement it."],
["Customers cannot find products because a new display is confusing.","visual",["sales","manager"],"Visual Merchandising owns product presentation, with frontline feedback from Sales."],
["Checkout staff report a discount is being applied incorrectly.","manager",["finance","sales"],"The Store Manager coordinates the operational issue while Finance validates impact."],
["A product sells out online much faster than expected.","ecommerce",["inventory","marketing"],"E-commerce investigates online demand while Inventory checks availability."],
["Several customers ask why their refund has not appeared yet.","finance",["customer","manager"],"Finance owns payment/refund processing while Support communicates status."],
["A seasonal collection must be displayed consistently in every store.","visual",["manager","marketing"],"Visual Merchandising owns presentation standards and coordinates execution."]
];
const S2=[
["A customer reports a missing item from an online order.",["customer","inventory","ecommerce"],"Support captures the issue, Inventory verifies fulfillment, then E-commerce coordinates correction."],
["A major stock discrepancy is discovered during a store count.",["inventory","manager","finance"],"Inventory investigates, the Manager coordinates the response, and Finance reconciles impact."],
["A weekend promotion is performing poorly.",["marketing","ecommerce","sales","manager"],"Marketing reviews the campaign, Digital checks the journey, Sales adds frontline evidence, and the Manager coordinates action."],
["Customers struggle to find a newly launched product in-store.",["sales","visual","manager"],"Sales provides customer feedback, Visual improves presentation, and the Manager implements the change."],
["Refund delays suddenly increase.",["customer","finance","manager"],"Support identifies patterns, Finance investigates processing, and the Manager escalates a wider issue."]
];
const S3=[
["Customer satisfaction suddenly drops across several stores.","manager",["customer","sales","visual","marketing"],"Broad satisfaction problems need operational leadership plus customer, frontline, presentation and messaging perspectives.","Customers → Support/Sales → Manager → Specialist Teams → Stores → Customers"],
["Sales increase dramatically after a social media campaign.","marketing",["inventory","ecommerce","manager"],"Marketing coordinates the demand response while Inventory, E-commerce and the Manager protect operations.","Campaign → Marketing → Inventory + E-commerce → Manager → Customers"],
["Negative reviews suddenly appear online about product availability.","manager",["customer","inventory","marketing"],"The Manager coordinates the response while Support, Inventory and Marketing handle their specialist parts.","Reviews → Support → Manager → Inventory/Marketing → Customer response"],
["A major seasonal product launch is delayed.","manager",["inventory","marketing","ecommerce"],"A cross-functional delay needs coordination, blocker removal and communication rather than one person doing everything.","Delay → Manager → Inventory + Marketing + E-commerce → Revised plan"]
];
let stage=1,q=0,sel=null,route=[],score={Ownership:0,Delegation:0,Collaboration:0,"Workflow Thinking":0};
const game=document.getElementById("game"),pg=document.getElementById("pg");
function prog(){let n=(stage-1)*3+q;pg.style.width=n/9*100+"%";document.getElementById("st").textContent=`Stage ${stage} of 3`;document.getElementById("qt").textContent=`Question ${Math.min(q+1,3)} of 3`}
function card(id){return `<div class="role" draggable="true" data-r="${id}"><div class="icon">${R[id][1]}</div><b>${R[id][0]}</b><span>${R[id][2]}</span></div>`}
function bind(fn){document.querySelectorAll(".role").forEach(e=>{e.onclick=()=>fn(e.dataset.r);e.ondragstart=x=>x.dataTransfer.setData("text/plain",e.dataset.r)})}
function next(){q++;if(q===3){stage++;q=0;if(stage===4)return finish()}render()}
function render(){
 prog();
 if(stage===1){sel=null;let s=S1[q];game.innerHTML=`<section class="intro card"><div class="stageNo">STAGE 1 • OWNERSHIP</div><h2>Who Owns This?</h2><p>Choose who should take responsibility for moving the work forward. Ownership does not mean doing every step personally.</p></section><section class="task card"><div class="ticket"><div class="label">WORK TICKET #${q+1}</div><h3>${s[0]}</h3></div><p style="color:var(--muted)">Drag one role into the ownership slot.</p><div class="roles" id="roles">${Object.keys(R).map(card).join("")}</div><div class="drop" id="drop">🎯 Drop the primary owner here</div><button class="btn" id="submit" disabled>Assign Ownership</button><div class="feedback" id="fb"></div></section>`;bind(selectOwner);let d=document.getElementById("drop");d.ondragover=e=>{e.preventDefault();d.classList.add("over")};d.ondragleave=()=>d.classList.remove("over");d.ondrop=e=>{e.preventDefault();d.classList.remove("over");selectOwner(e.dataTransfer.getData("text/plain"))};document.getElementById("submit").onclick=submit1}
 else if(stage===2){route=[];let s=S2[q];game.innerHTML=`<section class="intro card"><div class="stageNo">STAGE 2 • WORKFLOW</div><h2>Task Routing</h2><p>Build the handoff sequence. Think about who needs to act first, what evidence they create, and who can move the work forward next.</p></section><section class="task card"><div class="ticket"><div class="label">INCOMING WORK #${q+1}</div><h3>${s[0]}</h3></div><div class="route" id="route"></div><div class="roles" id="roles">${Object.keys(R).map(card).join("")}</div><button class="btn" id="submit" disabled>Run Workflow</button><button class="btn secondary" onclick="render()">Reset</button><div class="feedback" id="fb"></div></section>`;bind(addRoute);slots(s[1].length);document.getElementById("submit").onclick=submit2}
 else {sel=[];let s=S3[q];game.innerHTML=`<section class="intro card"><div class="stageNo">STAGE 3 • COLLABORATION</div><h2>Collaboration Challenge</h2><p>Choose up to four roles that should actively coordinate. Complex problems usually need multiple perspectives.</p></section><section class="task card"><div class="ticket"><div class="label">COMPLEX SITUATION #${q+1}</div><h3>${s[0]}</h3></div><div class="roles" id="roles">${Object.keys(R).map(card).join("")}</div><div class="chips" id="chips">No collaborators assigned yet.</div><button class="btn" id="submit" disabled>Coordinate Teams</button><div class="feedback" id="fb"></div></section>`;bind(toggle);document.getElementById("submit").onclick=submit3}
}
function selectOwner(id){sel=id;document.querySelectorAll(".role").forEach(e=>e.classList.toggle("selected",e.dataset.r===id));let d=document.getElementById("drop");d.classList.add("filled");d.innerHTML=R[id][1]+" <b>"+R[id][0]+"</b>";document.getElementById("submit").disabled=false}
function submit1(){let s=S1[q],ok=sel===s[1];score.Ownership+=ok?2:1;if(ok)score.Delegation++;let o=R[s[1]];show(`<h3>${ok?"🧭 Strong ownership match":"🔎 Let's unpack the ownership"}</h3><div class="grid"><div class="info"><strong>Primary Owner</strong>${o[1]} ${o[0]}</div><div class="info"><strong>Why</strong>${s[3]}</div><div class="info"><strong>May assist</strong>${s[2].map(x=>R[x][0]).join(", ")}</div></div><button class="btn" onclick="next()">Continue →</button>`)}
function slots(n){let b=document.getElementById("route");b.innerHTML="";for(let i=0;i<n;i++){if(i)b.innerHTML+="<div class='arrow'>→</div>";b.innerHTML+=`<div class="slot" data-i="${i}">${route[i]?R[route[i]][1]+" "+R[route[i]][0]:"Drop role"}</div>`}document.querySelectorAll(".slot").forEach(x=>{x.ondragover=e=>{e.preventDefault();x.classList.add("over")};x.ondragleave=()=>x.classList.remove("over");x.ondrop=e=>{e.preventDefault();x.classList.remove("over");put(+x.dataset.i,e.dataTransfer.getData("text/plain"))}});document.getElementById("submit").disabled=route.length!==n}
function addRoute(id){let n=S2[q][1].length;if(!route.includes(id)&&route.length<n){route.push(id);slots(n)}}
function put(i,id){route=route.filter(x=>x!==id);route[i]=id;route=route.filter(Boolean);slots(S2[q][1].length)}
function submit2(){let s=S2[q],ok=JSON.stringify(route)===JSON.stringify(s[1]);score["Workflow Thinking"]+=ok?2:1;if(ok)score.Delegation++;show(`<h3>${ok?"🚦 Smooth handoff":"🧩 Here's the stronger workflow"}</h3><div class="chips">${s[1].map((x,i)=>`<span class="chip">${R[x][1]} ${R[x][0]}${i<s[1].length-1?" →":""}</span>`).join("")}</div><div class="info"><strong>Why this order</strong>${s[2]}</div><button class="btn" onclick="next()">Continue →</button>`)}
function toggle(id){if(sel.includes(id))sel=sel.filter(x=>x!==id);else if(sel.length<4)sel.push(id);document.querySelectorAll(".role").forEach(e=>e.classList.toggle("selected",sel.includes(e.dataset.r)));document.getElementById("chips").innerHTML=sel.length?sel.map(x=>`<span class="chip">${R[x][1]} ${R[x][0]}</span>`).join(""):"No collaborators assigned yet.";document.getElementById("submit").disabled=!sel.length}
function submit3(){let s=S3[q],hits=sel.filter(x=>s[2].includes(x)).length;score.Collaboration+=hits>1?2:1;if(sel.includes(s[1]))score.Ownership++;show(`<h3>🤝 Collaboration map</h3><div class="grid"><div class="info"><strong>Primary Owner</strong>${R[s[1]][1]} ${R[s[1]][0]}</div><div class="info"><strong>Supporting Teams</strong>${s[2].map(x=>R[x][0]).join(", ")}</div><div class="info"><strong>Reasoning</strong>${s[3]}</div><div class="info"><strong>Communication Flow</strong>${s[4]}</div></div><button class="btn" onclick="next()">Continue →</button>`)}
function show(x){let f=document.getElementById("fb");f.innerHTML=x;f.classList.add("show");document.querySelectorAll("button").forEach(b=>{if(b.id==="submit")b.disabled=true})}
function finish(){pg.style.width="100%";document.getElementById("st").textContent="Complete";document.getElementById("qt").textContent="9 of 9";game.innerHTML="";let f=document.getElementById("final");f.classList.add("show");let best=Object.entries(score).sort((a,b)=>b[1]-a[1])[0][0];f.innerHTML=`<div class="celebrate">🎉</div><div class="stageNo">COMPASS COMPLETE</div><h2>You learned how work moves.</h2><p style="color:var(--muted)">This is not a test score. These patterns show where your organizational thinking was strongest during the simulation.</p>${Object.entries(score).map(([k,v])=>`<div class="bar"><div class="barhead"><span>${k}</span><b>${Math.round(v/6*100)}%</b></div><div class="track"><div class="fill" style="width:${Math.min(100,v/6*100)}%"></div></div></div>`).join("")}<div class="insight"><b>🧠 What you understood well</b><br>Your strongest area was <b>${best}</b>.</div><div class="insight"><b>📌 Where you may over-assign responsibility</b><br>Senior people often coordinate rather than personally perform every detail.</div><div class="insight"><b>🤝 Where collaboration matters</b><br>Cross-functional problems benefit from several perspectives without creating unnecessary handoffs.</div><div class="insight"><b>💡 Organizational insight</b><br>Many real workplace problems are solved by teams rather than individuals. Clear ownership gives direction while collaboration supplies expertise.</div><button class="btn" onclick="location.reload()">↻ Explore Again</button>`}
render();
</script>
</body>
</html>
