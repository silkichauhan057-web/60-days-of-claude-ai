<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Learning Studio — Linear &amp; Polynomial Regression</title>
<style>
:root{
  --bg:#0B0F1A;
  --surface:#131826;
  --surface2:#1B2333;
  --surface3:#212B40;
  --accent:#3ED6B5;
  --accent-dim:#1F5F52;
  --accent2:#FF6F59;
  --accent2-dim:#7A362C;
  --text:#E7EAF0;
  --muted:#8892A6;
  --grid:#232B3D;
  --success:#3ED6B5;
  --danger:#FF6F59;
  --radius:14px;
  --serif: Georgia, 'Times New Roman', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
}
:root.light{
  --bg:#F3F5F8;
  --surface:#FFFFFF;
  --surface2:#EEF1F6;
  --surface3:#E3E8F0;
  --text:#131826;
  --muted:#5B6478;
  --grid:#DCE1EA;
  --accent-dim:#CFF4EA;
  --accent2-dim:#FFE0DA;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  transition:background .3s ease, color .3s ease;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed; inset:0;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:32px 32px;
  opacity:.35;
  pointer-events:none;
  z-index:0;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* ===== Top bar ===== */
.topbar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:16px;
  padding:12px 20px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--grid);
}
.brand{
  display:flex; align-items:center; gap:10px;
  font-family:var(--mono); font-weight:700; letter-spacing:.5px;
  white-space:nowrap;
}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent); box-shadow:0 0 12px var(--accent);}
.brand small{display:block; font-family:var(--sans); font-weight:400; color:var(--muted); font-size:11px; letter-spacing:.3px;}
.topbar .progress-wrap{flex:1; display:flex; align-items:center; gap:10px;}
.progress-track{
  flex:1; height:8px; border-radius:6px; background:var(--surface2); overflow:hidden;
  border:1px solid var(--grid);
}
.progress-fill{
  height:100%; width:0%; border-radius:6px;
  background:linear-gradient(90deg, var(--accent), #7CF2D8);
  transition:width .5s cubic-bezier(.4,0,.2,1);
}
.progress-label{font-family:var(--mono); font-size:12px; color:var(--muted); white-space:nowrap;}
.xp-badge{
  font-family:var(--mono); font-size:12px; padding:6px 10px; border-radius:20px;
  background:var(--accent-dim); color:var(--accent); border:1px solid var(--accent);
  white-space:nowrap;
}
.icon-btn{
  background:var(--surface2); border:1px solid var(--grid); color:var(--text);
  width:36px; height:36px; border-radius:10px; cursor:pointer; font-size:16px;
  display:flex; align-items:center; justify-content:center;
  transition:transform .15s ease, background .15s ease;
}
.icon-btn:hover{background:var(--surface3); transform:translateY(-1px);}
.icon-btn:active{transform:translateY(0);}

/* ===== Layout ===== */
.layout{
  position:relative; z-index:1;
  display:grid; grid-template-columns:260px 1fr; gap:0;
  min-height:calc(100vh - 61px);
}
.sidebar{
  border-right:1px solid var(--grid);
  padding:20px 14px;
  position:sticky; top:61px; align-self:start;
  height:calc(100vh - 61px); overflow-y:auto;
}
.nav-group-label{
  font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:1px;
  color:var(--muted); margin:18px 8px 8px;
}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:10px; cursor:pointer;
  color:var(--muted); font-size:14px; margin-bottom:2px;
  border:1px solid transparent;
  transition:all .15s ease;
}
.nav-item .num{
  font-family:var(--mono); font-size:11px; width:22px; height:22px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:var(--surface2); color:var(--muted); flex-shrink:0;
}
.nav-item.active{background:var(--surface2); color:var(--text); border-color:var(--grid);}
.nav-item.active .num{background:var(--accent); color:#04140F;}
.nav-item.done .num{background:var(--accent-dim); color:var(--accent);}
.nav-item.done .num::after{content:"✓";}
.nav-item.locked{opacity:.4; cursor:not-allowed;}
.nav-item:hover:not(.locked){color:var(--text);}

main{padding:28px 32px 90px; max-width:920px; margin:0 auto; width:100%;}
.section{display:none; animation:fadeIn .4s ease;}
.section.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* ===== Typography ===== */
h1{font-family:var(--serif); font-size:2.4rem; line-height:1.15; margin:.2em 0 .3em; letter-spacing:-.5px;}
h2{font-family:var(--serif); font-size:1.7rem; margin:1.4em 0 .5em; letter-spacing:-.3px;}
h3{font-family:var(--sans); font-size:1.15rem; margin:1.3em 0 .5em; color:var(--text);}
h4{font-family:var(--mono); font-size:.85rem; text-transform:uppercase; letter-spacing:1px; color:var(--accent); margin:1.4em 0 .6em;}
p{line-height:1.7; color:var(--text); opacity:.92;}
.lede{font-size:1.1rem; color:var(--muted); line-height:1.7;}
.eyebrow{font-family:var(--mono); font-size:12px; text-transform:uppercase; letter-spacing:2px; color:var(--accent);}
code, .formula{font-family:var(--mono); background:var(--surface2); padding:2px 7px; border-radius:6px; font-size:.92em; color:var(--accent);}
.formula-block{
  font-family:var(--mono); background:var(--surface2); border:1px solid var(--grid); border-left:3px solid var(--accent);
  padding:16px 20px; border-radius:10px; margin:16px 0; font-size:1rem; overflow-x:auto;
}

/* ===== Cards ===== */
.card{
  background:var(--surface); border:1px solid var(--grid); border-radius:var(--radius);
  padding:22px 24px; margin:18px 0;
}
.card-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media (max-width:760px){.card-grid{grid-template-columns:1fr;} .layout{grid-template-columns:1fr;} .sidebar{display:none;}}
.analogy{
  background:linear-gradient(135deg, var(--accent-dim), transparent);
  border:1px solid var(--accent-dim); border-left:3px solid var(--accent);
  border-radius:var(--radius); padding:18px 22px; margin:18px 0;
}
.analogy .eyebrow{color:var(--accent);}
.misconception{
  background:linear-gradient(135deg, var(--accent2-dim), transparent);
  border:1px solid var(--accent2-dim); border-left:3px solid var(--accent2);
  border-radius:var(--radius); padding:18px 22px; margin:18px 0;
}
.misconception .eyebrow{color:var(--accent2);}
.takeaways{
  background:var(--surface2); border:1px solid var(--grid); border-radius:var(--radius);
  padding:18px 22px; margin:18px 0;
}
.takeaways ul{margin:8px 0 0; padding-left:20px;}
.takeaways li{margin-bottom:6px; line-height:1.6;}
.compare-table{width:100%; border-collapse:collapse; margin:14px 0; font-size:.92rem;}
.compare-table th, .compare-table td{padding:10px 12px; border-bottom:1px solid var(--grid); text-align:left;}
.compare-table th{font-family:var(--mono); font-size:11px; text-transform:uppercase; color:var(--muted); letter-spacing:.5px;}
.compare-table td strong{color:var(--accent);}

/* ===== Buttons ===== */
.btn{
  font-family:var(--sans); font-weight:600; font-size:14px;
  padding:11px 20px; border-radius:10px; border:1px solid var(--grid);
  background:var(--surface2); color:var(--text); cursor:pointer;
  transition:all .15s ease; display:inline-flex; align-items:center; gap:8px;
}
.btn:hover{transform:translateY(-1px); background:var(--surface3);}
.btn-primary{background:var(--accent); color:#04140F; border-color:var(--accent); font-weight:700;}
.btn-primary:hover{background:#5CE8CC;}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;}

/* ===== Widgets ===== */
.widget{
  background:var(--surface); border:1px solid var(--grid); border-radius:var(--radius);
  padding:20px; margin:20px 0;
}
.widget-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;}
.widget-title{font-family:var(--mono); font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--muted);}
.control-row{display:flex; align-items:center; gap:12px; margin:10px 0; flex-wrap:wrap;}
.control-row label{font-size:13px; color:var(--muted); min-width:130px; font-family:var(--mono);}
input[type=range]{
  flex:1; min-width:140px; accent-color:var(--accent); height:6px; cursor:pointer;
}
.readout{font-family:var(--mono); font-size:13px; background:var(--surface2); padding:5px 10px; border-radius:6px; color:var(--accent); min-width:60px; text-align:center;}
svg{display:block; width:100%; height:auto; background:var(--surface2); border-radius:10px;}
.metric-row{display:flex; gap:12px; flex-wrap:wrap; margin-top:14px;}
.metric{
  flex:1; min-width:110px; background:var(--surface2); border:1px solid var(--grid); border-radius:10px; padding:12px 14px;
}
.metric .val{font-family:var(--mono); font-size:1.4rem; font-weight:700; color:var(--accent);}
.metric .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;}

/* ===== Quiz ===== */
.quiz-card{border:1px solid var(--grid); border-radius:var(--radius); padding:22px 24px; margin:16px 0; background:var(--surface);}
.quiz-q{font-weight:600; margin-bottom:12px; font-size:1.02rem;}
.quiz-opts{display:flex; flex-direction:column; gap:8px;}
.quiz-opt{
  padding:12px 14px; border-radius:10px; border:1px solid var(--grid); background:var(--surface2);
  cursor:pointer; font-size:14px; transition:all .15s ease; display:flex; align-items:center; gap:10px;
}
.quiz-opt:hover{border-color:var(--accent);}
.quiz-opt.selected{border-color:var(--accent); background:var(--accent-dim);}
.quiz-opt.correct{border-color:var(--success); background:var(--accent-dim); color:var(--success);}
.quiz-opt.incorrect{border-color:var(--danger); background:var(--accent2-dim); color:var(--danger);}
.quiz-opt .letter{
  font-family:var(--mono); width:22px; height:22px; border-radius:6px; background:var(--surface3);
  display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0;
}
.quiz-explain{
  margin-top:12px; padding:12px 14px; border-radius:10px; background:var(--surface2);
  font-size:13.5px; color:var(--muted); display:none; border-left:3px solid var(--accent);
}
.quiz-explain.show{display:block;}
.quiz-summary{
  text-align:center; padding:30px 20px; border-radius:var(--radius);
  background:var(--surface); border:1px solid var(--grid); margin-top:20px;
}
.quiz-summary .score{font-family:var(--mono); font-size:3rem; font-weight:700; color:var(--accent);}

/* ===== Intro ===== */
.hero-badge{
  display:inline-flex; align-items:center; gap:8px; padding:6px 14px; border-radius:20px;
  background:var(--surface2); border:1px solid var(--grid); font-family:var(--mono); font-size:12px; color:var(--muted); margin-bottom:10px;
}
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:20px 0;}
@media (max-width:700px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat-box{background:var(--surface); border:1px solid var(--grid); border-radius:var(--radius); padding:16px; text-align:center;}
.stat-box .n{font-family:var(--mono); font-size:1.5rem; color:var(--accent); font-weight:700;}
.stat-box .l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-top:4px;}
.obj-list{list-style:none; padding:0; margin:10px 0;}
.obj-list li{display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--grid); line-height:1.5;}
.obj-list li::before{content:"→"; color:var(--accent); font-family:var(--mono); flex-shrink:0;}

/* ===== Reward strip ===== */
.reward-strip{display:flex; gap:12px; flex-wrap:wrap; margin:16px 0;}
.badge-slot{
  flex:1; min-width:140px; border:1px dashed var(--grid); border-radius:12px; padding:14px; text-align:center;
  background:var(--surface2);
}
.badge-slot.earned{border-style:solid; border-color:var(--accent); background:var(--accent-dim);}
.badge-slot .ic{font-size:1.6rem;}
.badge-slot .nm{font-size:11px; font-family:var(--mono); color:var(--muted); margin-top:4px;}
.badge-slot.earned .nm{color:var(--accent);}

/* ===== Footer nav within section ===== */
.section-footer{display:flex; justify-content:space-between; align-items:center; margin-top:36px; padding-top:20px; border-top:1px solid var(--grid);}

/* ===== Resource lists ===== */
.res-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media (max-width:700px){.res-grid{grid-template-columns:1fr;}}
.res-list{list-style:none; padding:0; margin:0;}
.res-list li{padding:9px 0; border-bottom:1px solid var(--grid); font-size:13.5px; line-height:1.5;}
.res-list li:last-child{border-bottom:none;}
.res-list .t{font-weight:600; display:block;}
.res-list .d{color:var(--muted); font-size:12.5px;}
.kw-chip{display:inline-block; font-family:var(--mono); font-size:12px; background:var(--surface2); border:1px solid var(--grid); padding:5px 10px; border-radius:16px; margin:4px 4px 0 0; color:var(--accent);}
.prompt-box{background:var(--surface2); border:1px solid var(--grid); border-left:3px solid var(--accent); border-radius:10px; padding:12px 14px; margin:8px 0; font-family:var(--mono); font-size:12.5px; color:var(--text); position:relative;}

/* Print */
@media print{
  .topbar, .sidebar, .btn-row, .icon-btn, .section-footer{display:none !important;}
  .section{display:block !important;}
  body::before{display:none;}
  .layout{display:block;}
  main{max-width:100%;}
}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--surface3); border-radius:6px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span>Interactive Learning Studio<small>Linear &amp; Polynomial Regression</small></div>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0% complete</div>
  </div>
  <div class="xp-badge" id="xpBadge">★ 0 XP</div>
  <button class="icon-btn" id="printBtn" title="Print / Save notes">⎙</button>
  <button class="icon-btn" id="themeBtn" title="Toggle theme">◐</button>
</div>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="main"></main>
</div>

<script>
/* =========================================================
   DATA — content is hard-generated for Linear & Polynomial
   Regression. Nothing here is fetched from a topic prompt.
   ========================================================= */

const state = {
  xp: 0,
  unlocked: [true, false, false, false, false], // intro implicit, modules 0-3, final
  quizScores: [null, null, null, null],
  quizAnswers: [[null,null,null,null],[null,null,null,null],[null,null,null,null],[null,null,null,null]],
  quizSubmitted: [false,false,false,false],
  finalDone: false,
  current: 'intro'
};

function loadState(){
  try{
    const raw = localStorage.getItem('ils-regression-state');
    if(raw){ Object.assign(state, JSON.parse(raw)); }
  }catch(e){}
}
function saveState(){
  try{ localStorage.setItem('ils-regression-state', JSON.stringify(state)); }catch(e){}
}

/* ---------- Small math helpers for live regression widgets ---------- */
function mean(a){ return a.reduce((s,v)=>s+v,0)/a.length; }
function mse(ys, preds){ let s=0; for(let i=0;i<ys.length;i++){ s += (ys[i]-preds[i])**2; } return s/ys.length; }
function rmse(ys,preds){ return Math.sqrt(mse(ys,preds)); }
function r2(ys, preds){
  const m = mean(ys);
  let ssRes=0, ssTot=0;
  for(let i=0;i<ys.length;i++){ ssRes += (ys[i]-preds[i])**2; ssTot += (ys[i]-m)**2; }
  return 1 - ssRes/ssTot;
}
function transpose(A){ return A[0].map((_,c)=>A.map(r=>r[c])); }
function matMul(A,B){
  const res = Array.from({length:A.length},()=>Array(B[0].length).fill(0));
  for(let i=0;i<A.length;i++) for(let j=0;j<B[0].length;j++){
    let s=0; for(let k=0;k<B.length;k++) s += A[i][k]*B[k][j];
    res[i][j]=s;
  }
  return res;
}
function solveLinear(A, b){ // Gaussian elimination, A n x n, b n x 1
  const n = A.length;
  const M = A.map((row,i)=>[...row, b[i][0]]);
  for(let col=0; col<n; col++){
    let piv = col;
    for(let r=col+1;r<n;r++) if(Math.abs(M[r][col])>Math.abs(M[piv][col])) piv=r;
    [M[col],M[piv]] = [M[piv],M[col]];
    if(Math.abs(M[col][col]) < 1e-9) M[col][col] = 1e-9;
    for(let r=0;r<n;r++){
      if(r===col) continue;
      const factor = M[r][col]/M[col][col];
      for(let c=col;c<=n;c++) M[r][c] -= factor*M[col][c];
    }
  }
  return M.map((row,i)=>[row[n]/row[i]]);
}
function polyFit(xs, ys, degree){
  const X = xs.map(x=>{ const row=[]; for(let d=0; d<=degree; d++) row.push(Math.pow(x,d)); return row; });
  const Y = ys.map(y=>[y]);
  const Xt = transpose(X);
  const XtX = matMul(Xt, X);
  const XtY = matMul(Xt, Y);
  const beta = solveLinear(XtX, XtY).map(r=>r[0]);
  return beta; // coefficients low->high degree
}
function polyPredict(beta, x){ let s=0; for(let d=0; d<beta.length; d++) s += beta[d]*Math.pow(x,d); return s; }

/* ---------- Fixed datasets used throughout ---------- */
const DATA_LINEAR = {
  xs:[1,2,3,3.5,4,5,6,6.5,7,8,9,10],
  ys:[55,58,66,64,70,74,79,83,85,90,93,97],
  xLabel:"Hours studied", yLabel:"Exam score"
};
const DATA_POLY = {
  xs:[-3,-2.5,-2,-1.5,-1,-0.5,0,0.5,1,1.5,2,2.5,3],
  ys:[9.4,7.0,5.1,3.0,2.4,1.1,1.3,0.9,1.8,2.6,3.3,5.6,7.0],
  xLabel:"Sensor reading (centered)", yLabel:"Signal strength"
};
const DATA_SPLIT = {
  trainX:[-3,-2,-1,0,1,2,3],
  trainY:[9.4,5.1,2.4,1.3,1.8,3.3,7.0],
  testX:[-2.5,-1.5,-0.5,0.5,1.5,2.5],
  testY:[7.0,3.0,1.1,0.9,2.6,5.6]
};

/* =========================================================
   SVG PLOT HELPERS
   ========================================================= */
function svgScatterLine(opts){
  const {xs, ys, w=640, h=320, pad=40, line, extraLines=[], xLabel="", yLabel="", pointColor="var(--accent2)", points2=null} = opts;
  const xMin = Math.min(...xs, ...(points2?points2.xs:[]), ...extraLines.flatMap(e=>e.xs)), xMax = Math.max(...xs, ...(points2?points2.xs:[]), ...extraLines.flatMap(e=>e.xs));
  const yMin = Math.min(...ys, ...(line?line.ys:[]), ...(points2?points2.ys:[]), ...extraLines.flatMap(e=>e.ys));
  const yMax = Math.max(...ys, ...(line?line.ys:[]), ...(points2?points2.ys:[]), ...extraLines.flatMap(e=>e.ys));
  const xPad = (xMax-xMin)*0.1 || 1, yPad=(yMax-yMin)*0.15 || 1;
  const sx = x => pad + (x-(xMin-xPad))/((xMax+xPad)-(xMin-xPad)) * (w-2*pad);
  const sy = y => h-pad - (y-(yMin-yPad))/((yMax+yPad)-(yMin-yPad)) * (h-2*pad);
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;
  // grid
  for(let i=0;i<=6;i++){
    const gx = pad + i*(w-2*pad)/6;
    const gy = pad + i*(h-2*pad)/6;
    s += `<line x1="${gx}" y1="${pad}" x2="${gx}" y2="${h-pad}" stroke="var(--grid)" stroke-width="1"/>`;
    s += `<line x1="${pad}" y1="${gy}" x2="${w-pad}" y2="${gy}" stroke="var(--grid)" stroke-width="1"/>`;
  }
  // axes
  s += `<line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--muted)" stroke-width="1.5"/>`;
  s += `<line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="var(--muted)" stroke-width="1.5"/>`;
  extraLines.forEach(el=>{
    const pts = el.xs.map((x,i)=>`${sx(x)},${sy(el.ys[i])}`).join(' ');
    s += `<polyline points="${pts}" fill="none" stroke="${el.color}" stroke-width="2" stroke-dasharray="${el.dash||'0'}" opacity="${el.opacity||1}"/>`;
  });
  if(line){
    const pts = line.xs.map((x,i)=>`${sx(x)},${sy(line.ys[i])}`).join(' ');
    s += `<polyline points="${pts}" fill="none" stroke="${line.color||'var(--accent)'}" stroke-width="3"/>`;
  }
  xs.forEach((x,i)=>{
    s += `<circle cx="${sx(x)}" cy="${sy(ys[i])}" r="5" fill="${pointColor}" stroke="var(--bg)" stroke-width="1.5"/>`;
  });
  if(points2){
    points2.xs.forEach((x,i)=>{
      s += `<circle cx="${sx(x)}" cy="${sy(points2.ys[i])}" r="5" fill="${points2.color||'var(--accent)'}" stroke="var(--bg)" stroke-width="1.5"/>`;
    });
  }
  s += `<text x="${w/2}" y="${h-8}" text-anchor="middle" fill="var(--muted)" font-size="11" font-family="monospace">${xLabel}</text>`;
  s += `<text x="14" y="${h/2}" text-anchor="middle" fill="var(--muted)" font-size="11" font-family="monospace" transform="rotate(-90 14 ${h/2})">${yLabel}</text>`;
  s += `</svg>`;
  return s;
}

    <p class="lede">A model is only as trustworthy as the way it's evaluated. This module ties everything together into the practical workflow you'd actually use to build and validate a regression model.</p>

    <h3>Train/test split</h3>
    <p>To honestly measure generalization, you never evaluate a model on the same data it was fit on. Instead, you split your dataset:</p>
    <table class="compare-table">
      <tr><th>Set</th><th>Purpose</th><th>Typical size</th></tr>
      <tr><td><strong>Training set</strong></td><td>Used to fit the model's coefficients</td><td>~70–80%</td></tr>
      <tr><td><strong>Test set</strong></td><td>Held out entirely until the end, used to estimate real-world performance</td><td>~20–30%</td></tr>
      <tr><td><strong>Validation set (optional)</strong></td><td>Used during development to tune choices like polynomial degree, without peeking at the test set</td><td>Carved out of training data</td></tr>
    </table>
    <p>For more robust estimates with limited data, <strong>k-fold cross-validation</strong> repeats this process k times with different splits and averages the results, so every point gets used for both training and validation across folds.</p>

    <h3>Evaluation metrics</h3>
    <div class="formula-block">R² = 1 − (SS_residual / SS_total)</div>
    <p><code>R²</code> ("R-squared") measures the proportion of variance in y explained by the model, from roughly 0 (no better than predicting the mean) to 1 (perfect fit). <strong>RMSE</strong> (root mean squared error) and <strong>MAE</strong> (mean absolute error) express typical prediction error in the same units as y — RMSE penalizes large errors more (due to squaring), MAE treats all errors proportionally.</p>

    <div id="widget4"></div>

    <h3>A preview of regularization</h3>
    <p>Rather than manually picking a polynomial degree, techniques like <strong>Ridge</strong> and <strong>Lasso</strong> regression add a penalty term to the cost function that discourages coefficients from growing too large, automatically taming overfitting even with a high-degree model. You'll go deeper on these in a dedicated "Regularized Regression" tutorial — for now, know that they exist as the next natural step once you're comfortable with everything here.</p>

    <h3>Feature scaling for polynomial terms</h3>
    <p>Because x² and x³ grow at very different rates than x, unscaled polynomial features can cause numerical instability during fitting. Standardizing (subtracting the mean, dividing by standard deviation) each feature before fitting keeps the optimization well-behaved, especially at higher degrees.</p>

    <div class="misconception">
      <div class="eyebrow">Common misconception</div>
      <p style="margin-bottom:0"><strong>"A higher R² on the training set means a better model."</strong> R² on training data mechanically increases (or stays the same) every time you add a feature or raise polynomial degree — even meaningless ones. Only R² (or RMSE/MAE) computed on held-out test data honestly reflects predictive quality.</p>

function wireFinalChallenge(){
  const {trainX, trainY, testX, testY} = DATA_SPLIT;
  let bestDegree=1, bestErr=Infinity;
  for(let d=1; d<=9; d++){
    const beta = polyFit(trainX, trainY, d);
    const e = mse(testY, testX.map(x=>polyPredict(beta,x)));
    if(e<bestErr){bestErr=e; bestDegree=d;}
  }
  function render(){
    const degree = parseInt(document.getElementById('fc-degree').value);
    document.getElementById('fc-degree-val').textContent = degree;
    const beta = polyFit(trainX, trainY, degree);
    const trainMSE = mse(trainY, trainX.map(x=>polyPredict(beta,x)));
    const testPreds = testX.map(x=>polyPredict(beta,x));
    const testMSE = mse(testY, testPreds);
    const testR2 = r2(testY, testPreds);
    document.getElementById('fc-train').textContent = trainMSE.toFixed(2);
    document.getElementById('fc-test').textContent = testMSE.toFixed(2);
    document.getElementById('fc-r2').textContent = isFinite(testR2)? testR2.toFixed(2): '—';
    const fineXs=[]; for(let i=0;i<=80;i++) fineXs.push(-3 + i*6/80);
    const fineYs = fineXs.map(x=>polyPredict(beta,x));
    document.getElementById('fc-plot').innerHTML = svgScatterLine({
      xs:[...trainX], ys:[...trainY], xLabel:"x  (teal dots = train, coral dots = test)", yLabel:"y",
      line:{xs:fineXs, ys:fineYs, color:'var(--accent)'},
      pointColor:'var(--accent)',
      points2:{xs:testX, ys:testY, color:'var(--accent2)'}
    });
  }
  document.getElementById('fc-degree').addEventListener('input', render);
  document.getElementById('fc-submit').addEventListener('click', ()=>{
    const degree = parseInt(document.getElementById('fc-degree').value);
    const fb = document.getElementById('fc-feedback');
    fb.classList.add('show');
    if(Math.abs(degree-bestDegree)<=1){
      fb.innerHTML = `🏆 Great call. Degree ${degree} keeps test error near its minimum (the sweet spot in this dataset is around degree ${bestDegree}). You balanced bias and variance instead of chasing training accuracy.`;
      document.getElementById('fc-status').textContent = "Passed ✓";
      state.finalDone = true;
      awardXP(150);
      saveState();
      renderSidebar();
    } else if(degree < bestDegree){
      fb.innerHTML = `⚠️ Degree ${degree} is likely underfitting — the curve is too rigid to capture the true shape, so both train and test error stay higher than they need to. Try increasing the degree slightly and compare test MSE.`;
      document.getElementById('fc-status').textContent = "Try again";
    } else {
      fb.innerHTML = `⚠️ Degree ${degree} is likely overfitting — training error looks great, but test error is climbing because the curve is chasing noise. Try lowering the degree and comparing test MSE.`;
      document.getElementById('fc-status').textContent = "Try again";
    }
  });
  render();
}

    <p style="color:var(--muted)">Answer all four questions. You need at least 3 correct to unlock the next module.</p>
    <div id="quiz-${idx}"></div>
    <div class="section-footer">
      <button class="btn" id="prevBtn">← Back</button>
      <button class="btn btn-primary" id="nextBtn" disabled>Continue →</button>
    </div>
  `;
}

function renderQuiz(idx){
  const container = document.getElementById('quiz-'+idx);
  const quiz = MODULES[idx].quiz;
  let html = '';
  quiz.forEach((q,qi)=>{
    html += `<div class="quiz-card">
      <div class="quiz-q">${qi+1}. ${q.q}</div>
      <div class="quiz-opts" data-qi="${qi}">
        ${q.opts.map((opt,oi)=>`<div class="quiz-opt" data-oi="${oi}"><span class="letter">${String.fromCharCode(65+oi)}</span><span>${opt}</span></div>`).join('')}
      </div>
      <div class="quiz-explain" id="explain-${idx}-${qi}"></div>
    </div>`;
  });
  html += `<div class="btn-row"><button class="btn btn-primary" id="submitQuiz${idx}">Submit answers</button></div>`;
  html += `<div id="quizSummary${idx}"></div>`;
  container.innerHTML = html;

  container.querySelectorAll('.quiz-opts').forEach(group=>{
    const qi = parseInt(group.dataset.qi);
    group.querySelectorAll('.quiz-opt').forEach(opt=>{
      opt.addEventListener('click', ()=>{
        if(state.quizSubmitted[idx]) return;
        group.querySelectorAll('.quiz-opt').forEach(o=>o.classList.remove('selected'));
        opt.classList.add('selected');
        state.quizAnswers[idx][qi] = parseInt(opt.dataset.oi);
      });
    });
  });

  document.getElementById('submitQuiz'+idx).addEventListener('click', ()=>{
    const answers = state.quizAnswers[idx];
    if(answers.some(a=>a===null)){
      alert('Please answer all four questions before submitting.');
      return;
    }
    let score = 0;
    quiz.forEach((q,qi)=>{
      const group = container.querySelector(`.quiz-opts[data-qi="${qi}"]`);
      const opts = group.querySelectorAll('.quiz-opt');
      opts.forEach((o,oi)=>{
        o.style.pointerEvents='none';
        if(oi===q.correct) o.classList.add('correct');
        else if(oi===answers[qi]) o.classList.add('incorrect');
      });
      if(answers[qi]===q.correct) score++;
      const ex = document.getElementById(`explain-${idx}-${qi}`);
      ex.classList.add('show');
      ex.innerHTML = `<strong>${answers[qi]===q.correct ? '✅ Correct.' : '❌ Not quite.'}</strong> ${q.explain}`;
    });
    state.quizScores[idx] = score;
    state.quizSubmitted[idx] = true;
    const passed = score>=3;
    if(passed){
      state.unlocked[idx+1] = true;
      awardXP(50 + score*10);
    }
    saveState();
    document.getElementById('submitQuiz'+idx).style.display='none';
    document.getElementById('quizSummary'+idx).innerHTML = `
      <div class="quiz-summary">
        <div class="score">${score}/4</div>
        <p>${passed ? 'Module passed! Next module unlocked.' : 'You need at least 3/4 to unlock the next module.'}</p>
        ${!passed ? `<button class="btn" id="retryQuiz${idx}">Retry quiz</button>` : ''}
      </div>
    `;
    if(!passed){
      document.getElementById('retryQuiz'+idx).addEventListener('click', ()=>{
        state.quizSubmitted[idx]=false;
        state.quizAnswers[idx]=[null,null,null,null];
        saveState();
        renderQuiz(idx);
      });
    }
    document.getElementById('nextBtn').disabled = !passed;
    renderSidebar();
  });

  if(state.quizSubmitted[idx]){
    // re-render already-submitted state
    const answers = state.quizAnswers[idx];
    quiz.forEach((q,qi)=>{
      const group = container.querySelector(`.quiz-opts[data-qi="${qi}"]`);
      const opts = group.querySelectorAll('.quiz-opt');
      opts.forEach((o,oi)=>{
        o.style.pointerEvents='none';
        if(oi===q.correct) o.classList.add('correct');
        else if(oi===answers[qi]) o.classList.add('incorrect');
      });
      const ex = document.getElementById(`explain-${idx}-${qi}`);
      ex.classList.add('show');
      ex.innerHTML = `<strong>${answers[qi]===q.correct ? '✅ Correct.' : '❌ Not quite.'}</strong> ${q.explain}`;
    });
    document.getElementById('submitQuiz'+idx).style.display='none';
    const passed = state.quizScores[idx]>=3;
    document.getElementById('quizSummary'+idx).innerHTML = `
      <div class="quiz-summary">
        <div class="score">${state.quizScores[idx]}/4</div>
        <p>${passed ? 'Module passed! Next module unlocked.' : 'You need at least 3/4 to unlock the next module.'}</p>
        ${!passed ? `<button class="btn" id="retryQuiz${idx}">Retry quiz</button>` : ''}
      </div>
    `;
    if(!passed){
      document.getElementById('retryQuiz'+idx).addEventListener('click', ()=>{
        state.quizSubmitted[idx]=false;
        state.quizAnswers[idx]=[null,null,null,null];
        saveState();
        renderQuiz(idx);
      });
    }
    document.getElementById('nextBtn').disabled = !passed;
  }
}

function finalHTML(){
  if(!state.unlocked[4]){
    return `<h1>Final Challenge</h1><p class="lede">Complete all four modules with a passing quiz score to unlock the final challenge.</p>`;
  }
  return `
    <div class="eyebrow">Capstone</div>
    <h1>Final Practical Challenge</h1>
    ${renderFinalChallenge()}
    <div class="section-footer">
      <button class="btn" id="prevBtn">← Back</button>
      <button class="btn btn-primary" id="nextBtn">Cheat Sheet &amp; Resources →</button>
    </div>
  `;
}

function resourcesHTML(){
  return `
    <div class="eyebrow">Reference</div>
    <h1>Cheat Sheet, Summary &amp; Continued Learning</h1>
    <p class="lede">Everything on this page is designed to be printed or saved as your permanent reference notes (use the print icon in the top bar).</p>
    <h2>Cheat sheet</h2>
    ${CHEAT_SHEET}
    <h2>Summary notes</h2>
    <div class="card">
      <p>Linear regression fits <code>ŷ = b₀ + Σbᵢxᵢ</code> by minimizing MSE. Multiple predictors require checking linearity, independence, homoscedasticity, normal residuals, and low multicollinearity. Polynomial regression adds power terms to model curvature while remaining linear in its coefficients — but higher degree trades bias for variance, risking overfitting. Always select model complexity using held-out test performance (R², RMSE, MAE via train/test split or cross-validation), never training performance alone. Regularization (Ridge/Lasso) offers an automatic alternative to manual degree selection.</p>
    </div>
    <h2>Continue learning</h2>
    ${RESOURCES}
    <div class="section-footer">
      <button class="btn" id="prevBtn">← Back to Final Challenge</button>
      <button class="btn btn-primary" id="restartBtn">Restart course</button>
    </div>
  `;
}

function wireFooterNav(){
  const prev = document.getElementById('prevBtn');
  const next = document.getElementById('nextBtn');
  const start = document.getElementById('startBtn');
  const restart = document.getElementById('restartBtn');
  if(prev) prev.addEventListener('click', ()=>{
    const i = SECTIONS.indexOf(state.current);
    if(i>0) goTo(SECTIONS[i-1]);
  });
  if(next) next.addEventListener('click', ()=>{
    const i = SECTIONS.indexOf(state.current);
    if(i<SECTIONS.length-1 && isUnlocked(SECTIONS[i+1])) goTo(SECTIONS[i+1]);
  });
  if(start) start.addEventListener('click', ()=> goTo('m0'));
  if(restart) restart.addEventListener('click', ()=>{
    if(confirm('This will reset all progress. Continue?')){
      localStorage.removeItem('ils-regression-state');
      location.reload();
    }
  });
  renderRewardStrip();
  // fix module nextBtn enabling on revisits
  if(state.current.startsWith('m')){
    const idx = parseInt(state.current.replace('m',''));
    const nb = document.getElementById('nextBtn');
    if(nb && state.quizSubmitted[idx] && state.quizScores[idx]>=3) nb.disabled=false;
  }
}

/* =========================================================
   THEME + PRINT
   ========================================================= */
function initTheme(){
  const saved = localStorage.getItem('ils-theme');
  if(saved==='light') document.documentElement.classList.add('light');
  document.getElementById('themeBtn').addEventListener('click', ()=>{
    document.documentElement.classList.toggle('light');
    localStorage.setItem('ils-theme', document.documentElement.classList.contains('light')?'light':'dark');
  });
  document.getElementById('printBtn').addEventListener('click', ()=> window.print());
}

/* =========================================================
   INIT
   ========================================================= */
loadState();
initTheme();
renderSidebar();
renderMain();
</script>
